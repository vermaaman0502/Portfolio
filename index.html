<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aman Verma — Space Portfolio</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
  canvas { display: block; }

  /* HUD */
  #hud {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 10;
  }
  #crosshair {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 20px; height: 20px;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(0,255,255,0.7);
  }
  #crosshair::before { top: 50%; left: 0; width: 100%; height: 1px; transform: translateY(-50%); }
  #crosshair::after  { left: 50%; top: 0; height: 100%; width: 1px; transform: translateX(-50%); }

  #proximity-label {
    position: absolute; bottom: 120px; left: 50%;
    transform: translateX(-50%);
    color: cyan; font-size: 14px; letter-spacing: 2px;
    text-align: center; text-transform: uppercase;
    opacity: 0; transition: opacity 0.4s;
    text-shadow: 0 0 10px cyan;
  }
  #proximity-label.show { opacity: 1; }

  #controls-hint {
    position: absolute; bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.4); font-size: 12px;
    letter-spacing: 1px; text-align: center;
  }

  #name-tag {
    position: absolute; top: 24px; left: 50%;
    transform: translateX(-50%);
    color: cyan; font-size: 22px; font-weight: 700;
    letter-spacing: 4px; text-transform: uppercase;
    text-shadow: 0 0 20px cyan, 0 0 40px cyan;
  }

  #speed-bar {
    position: absolute; bottom: 60px; right: 30px;
    width: 8px; height: 120px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(0,255,255,0.3);
    border-radius: 4px; overflow: hidden;
  }
  #speed-fill {
    position: absolute; bottom: 0; width: 100%;
    background: linear-gradient(to top, cyan, #0af);
    transition: height 0.1s;
  }
  #speed-label {
    position: absolute; bottom: 44px; right: 44px;
    color: rgba(0,255,255,0.6); font-size: 9px; letter-spacing: 1px;
  }

  /* ===== PANEL OVERLAY ===== */
  #panel-overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s;
  }
  #panel-overlay.open { opacity: 1; pointer-events: all; }

  #panel {
    position: relative;
    width: min(860px, 94vw);
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 16px;
    padding: 40px 44px;
    background: linear-gradient(135deg, rgba(5,15,35,0.97), rgba(0,5,20,0.97));
    border: 1px solid var(--accent, cyan);
    box-shadow: 0 0 60px var(--accent, cyan), inset 0 0 30px rgba(0,0,0,0.5);
    transform: perspective(900px) rotateY(0deg) scale(0.85);
    transition: transform 0.5s cubic-bezier(.22,1,.36,1);
    scrollbar-width: thin; scrollbar-color: cyan transparent;
  }
  #panel-overlay.open #panel {
    transform: perspective(900px) rotateY(0deg) scale(1);
  }

  #panel::-webkit-scrollbar { width: 4px; }
  #panel::-webkit-scrollbar-thumb { background: cyan; border-radius: 2px; }

  #panel-close {
    position: absolute; top: 16px; right: 20px;
    background: none; border: none;
    color: var(--accent, cyan); font-size: 28px;
    cursor: pointer; line-height: 1; opacity: 0.7;
    transition: opacity .2s, transform .2s;
  }
  #panel-close:hover { opacity: 1; transform: rotate(90deg); }

  #panel-title {
    font-size: 26px; font-weight: 800; letter-spacing: 4px;
    text-transform: uppercase; color: var(--accent, cyan);
    text-shadow: 0 0 20px var(--accent, cyan);
    margin-bottom: 28px; padding-bottom: 14px;
    border-bottom: 1px solid rgba(0,255,255,0.2);
  }

  /* Section content styles */
  .section-block { margin-bottom: 28px; }
  .section-block h3 {
    font-size: 13px; letter-spacing: 3px; text-transform: uppercase;
    color: var(--accent, cyan); opacity: 0.7; margin-bottom: 14px;
  }

  /* Skills grid */
  .skill-category { margin-bottom: 16px; }
  .skill-category-title {
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    color: rgba(255,255,255,0.4); margin-bottom: 8px;
  }
  .skill-tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .skill-tag {
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 13px; font-weight: 600;
    color: #fff;
    border: 1px solid var(--accent, cyan);
    background: rgba(0,255,255,0.08);
    box-shadow: 0 0 8px rgba(0,255,255,0.15);
    transition: all .2s;
  }
  .skill-tag:hover { background: rgba(0,255,255,0.25); box-shadow: 0 0 16px var(--accent); }

  /* Experience cards */
  .exp-card {
    border-left: 2px solid var(--accent, cyan);
    padding: 14px 20px;
    margin-bottom: 20px;
    background: rgba(255,255,255,0.03);
    border-radius: 0 8px 8px 0;
  }
  .exp-role {
    font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 2px;
  }
  .exp-meta {
    font-size: 11px; letter-spacing: 1px; color: var(--accent, cyan);
    opacity: 0.7; margin-bottom: 10px;
  }
  .exp-bullets { list-style: none; }
  .exp-bullets li {
    font-size: 13px; color: rgba(255,255,255,0.75);
    padding: 3px 0 3px 16px; position: relative; line-height: 1.6;
  }
  .exp-bullets li::before {
    content: '▸'; position: absolute; left: 0;
    color: var(--accent, cyan);
  }

  /* Project cards */
  .proj-card {
    border: 1px solid rgba(0,255,255,0.15);
    border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
    background: rgba(255,255,255,0.02);
    transition: border-color .2s, box-shadow .2s;
  }
  .proj-card:hover {
    border-color: var(--accent, cyan);
    box-shadow: 0 0 20px rgba(0,255,255,0.1);
  }
  .proj-title { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 8px; }
  .proj-bullets { list-style: none; }
  .proj-bullets li {
    font-size: 13px; color: rgba(255,255,255,0.7);
    padding: 2px 0 2px 16px; position: relative; line-height: 1.6;
  }
  .proj-bullets li::before { content: '▸'; position: absolute; left: 0; color: var(--accent, cyan); }

  /* Education */
  .edu-card {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 16px; border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(0,255,255,0.1);
    margin-bottom: 12px;
  }
  .edu-icon { font-size: 28px; flex-shrink: 0; }
  .edu-degree { font-size: 15px; font-weight: 700; color: #fff; }
  .edu-school { font-size: 13px; color: var(--accent, cyan); opacity: 0.8; }
  .edu-year   { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }

  /* Contact / About */
  .contact-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.8); font-size: 14px;
  }
  .contact-icon { font-size: 20px; width: 32px; text-align: center; }
  .contact-link { color: var(--accent, cyan); text-decoration: none; }
  .contact-link:hover { text-decoration: underline; }

  /* Certifications */
  .cert-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border-radius: 8px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(0,255,255,0.1);
    margin-bottom: 10px; color: rgba(255,255,255,0.85); font-size: 14px;
  }
  .cert-badge { font-size: 22px; }

  /* Landing animation for planet name */
  #landing-flash {
    position: fixed; inset: 0; z-index: 90;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
    font-size: clamp(30px, 8vw, 72px);
    font-weight: 900; letter-spacing: 8px; text-transform: uppercase;
    color: var(--accent, cyan);
    text-shadow: 0 0 40px var(--accent, cyan), 0 0 80px var(--accent, cyan);
    transition: opacity 0.3s;
  }

  /* Orbit labels (3D CSS overlay is handled via canvas labels in Three.js; 
     these small pill labels appear near planets) */
  .planet-label-div {
    position: fixed; pointer-events: none; z-index: 5;
    color: #fff; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; white-space: nowrap;
    background: rgba(0,0,0,0.5);
    padding: 3px 10px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    transform: translate(-50%, -100%);
    opacity: 0; transition: opacity .3s;
  }

  /* Intro screen */
  #intro {
    position: fixed; inset: 0; z-index: 200;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    transition: opacity 1s;
  }
  #intro h1 {
    font-size: clamp(28px, 6vw, 64px);
    font-weight: 900; letter-spacing: 6px;
    color: cyan; text-shadow: 0 0 30px cyan, 0 0 60px cyan;
    text-transform: uppercase;
  }
  #intro p { color: rgba(255,255,255,0.5); letter-spacing: 2px; font-size: 14px; }
  #start-btn {
    margin-top: 20px;
    padding: 14px 44px;
    background: transparent;
    border: 1px solid cyan;
    color: cyan; font-size: 14px; letter-spacing: 3px;
    text-transform: uppercase; cursor: pointer;
    border-radius: 4px;
    transition: background .2s, box-shadow .2s;
  }
  #start-btn:hover {
    background: rgba(0,255,255,0.12);
    box-shadow: 0 0 20px cyan;
  }
  .star-intro {
    position: absolute; width: 2px; height: 2px;
    background: white; border-radius: 50%;
  }

  /* Mini map */
  #minimap {
    position: fixed; bottom: 24px; left: 24px;
    width: 120px; height: 120px;
    border: 1px solid rgba(0,255,255,0.25);
    border-radius: 50%;
    background: rgba(0,0,0,0.5);
    overflow: hidden; z-index: 10;
  }
  #minimap canvas { width: 100%; height: 100%; }

  /* ===== WARP OVERLAY ===== */
  #warp-overlay {
    position: fixed; inset: 0; z-index: 80;
    pointer-events: none; opacity: 0;
    transition: opacity 0.15s;
  }
  #warp-overlay.active { opacity: 1; }

  /* Warp destination text */
  #warp-destination {
    position: fixed; inset: 0; z-index: 85;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none; opacity: 0;
    transition: opacity 0.2s;
    gap: 12px;
  }
  #warp-destination.show { opacity: 1; }
  #warp-dest-label {
    font-size: clamp(12px,2vw,16px); letter-spacing: 6px;
    text-transform: uppercase; color: rgba(255,255,255,0.7);
  }
  #warp-dest-name {
    font-size: clamp(32px,8vw,80px); font-weight: 900;
    letter-spacing: 8px; text-transform: uppercase;
    color: var(--warp-color, cyan);
    text-shadow: 0 0 40px var(--warp-color, cyan),
                 0 0 80px var(--warp-color, cyan),
                 0 0 120px var(--warp-color, cyan);
    animation: warpPulse 0.3s ease-in-out infinite alternate;
  }
  @keyframes warpPulse {
    from { transform: scale(1);   letter-spacing: 8px; }
    to   { transform: scale(1.04); letter-spacing: 12px; }
  }
  #warp-countdown {
    font-size: 13px; letter-spacing: 4px;
    color: rgba(255,255,255,0.4); text-transform: uppercase;
  }

  /* ===== SKILL BARS ===== */
  .skill-bar-wrap { margin-bottom: 14px; }
  .skill-bar-header {
    display: flex; justify-content: space-between;
    font-size: 13px; color: rgba(255,255,255,0.8);
    margin-bottom: 6px; font-weight: 600;
  }
  .skill-bar-track {
    height: 6px; background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
  }
  .skill-bar-fill {
    height: 100%; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent, cyan), var(--accent2, #0af));
    box-shadow: 0 0 8px var(--accent, cyan);
    width: 0;
    transition: width 1.2s cubic-bezier(.22,1,.36,1);
  }

  /* ===== TECH TAGS ===== */
  .tech-tag {
    display: inline-block;
    padding: 3px 10px; border-radius: 4px;
    font-size: 11px; letter-spacing: 1px;
    font-weight: 700; text-transform: uppercase;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.6);
    margin: 3px 2px;
  }

  /* ===== STAT CARDS ===== */
  .stats-row {
    display: grid; grid-template-columns: repeat(3,1fr); gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    text-align: center; padding: 16px 10px;
    border-radius: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .stat-number {
    font-size: 28px; font-weight: 900;
    color: var(--accent, cyan);
    text-shadow: 0 0 12px var(--accent, cyan);
  }
  .stat-desc { font-size: 10px; color: rgba(255,255,255,0.4); letter-spacing: 1px; margin-top: 4px; }

  /* ===== TIMELINE ===== */
  .timeline { position: relative; padding-left: 24px; }
  .timeline::before {
    content: ''; position: absolute; left: 7px; top: 0; bottom: 0;
    width: 2px; background: linear-gradient(to bottom, var(--accent,cyan), transparent);
  }
  .timeline-item { position: relative; margin-bottom: 28px; }
  .timeline-dot {
    position: absolute; left: -21px; top: 4px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent, cyan);
    box-shadow: 0 0 10px var(--accent, cyan);
  }

  /* ===== ABOUT HERO ===== */
  .about-hero {
    display: flex; gap: 24px; align-items: center;
    margin-bottom: 28px; padding: 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .about-avatar {
    width: 80px; height: 80px; flex-shrink: 0;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent,cyan), #0033ff);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px;
    box-shadow: 0 0 20px var(--accent,cyan);
  }
  .about-bio { font-size: 13px; color: rgba(255,255,255,0.7); line-height: 1.7; }
  .about-name { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 4px; }
  .about-role { font-size: 12px; letter-spacing: 2px; color: var(--accent,cyan); margin-bottom: 10px; }
</style>
</head>

  <p>Full Stack Developer &nbsp;·&nbsp; Space Portfolio</p>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';

/* ══════════════════════════════════════════════════
   SCENE SETUP
══════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000005, 0.0006);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 5000);
camera.position.set(0, 20, 80);

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ══════════════════════════════════════════════════
   LIGHTING
══════════════════════════════════════════════════ */
scene.add(new THREE.AmbientLight(0x111133, 2));
const sun = new THREE.PointLight(0x8888ff, 3, 2000);
sun.position.set(0, 200, 0);
scene.add(sun);

/* ══════════════════════════════════════════════════
   STARS BACKGROUND
══════════════════════════════════════════════════ */
function createStarField(count = 8000) {
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi   = Math.acos(2 * Math.random() - 1);
    const r     = 600 + Math.random() * 1400;
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    const t = Math.random();
    col[i*3]   = 0.7 + t * 0.3;
    col[i*3+1] = 0.7 + t * 0.3;
    col[i*3+2] = 0.8 + t * 0.2;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));
  const mat = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, sizeAttenuation: true });
  scene.add(new THREE.Points(geo, mat));
}
createStarField();

/* ══════════════════════════════════════════════════
   NEBULA BACKGROUND SPRITES
══════════════════════════════════════════════════ */
function makeNebulaSprite(color, x, y, z, size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 256;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(128,128,0,128,128,128);
  gradient.addColorStop(0, color.replace(')',', 0.35)').replace('rgb','rgba'));
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,256,256);
  const tex = new THREE.CanvasTexture(canvas);
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const spr = new THREE.Sprite(mat);
  spr.position.set(x, y, z);
  spr.scale.set(size, size, 1);
  scene.add(spr);
}
makeNebulaSprite('rgb(50,0,150)',  -400, 100, -600, 600);
makeNebulaSprite('rgb(0,80,150)',   300,-100, -500, 500);
makeNebulaSprite('rgb(150,0,80)',  -200,-200, -700, 700);
makeNebulaSprite('rgb(0,150,120)',  500, 200, -400, 400);

/* ══════════════════════════════════════════════════
   PLANET / OBJECT DEFINITIONS
══════════════════════════════════════════════════ */
const PLANETS = [
  {
    id: 'skills',
    label: 'SKILLS',
    position: new THREE.Vector3(-280, 30, -180),
    radius: 38,
    color: 0x00ccff,
    emissive: 0x003355,
    accent: '#00ccff',
    ringColor: 0x00aadd,
    hasRings: true,
    glowColor: '#00ccff',
  },
  {
    id: 'experience',
    label: 'EXPERIENCE',
    position: new THREE.Vector3(300, -20, -220),
    radius: 44,
    color: 0xff6600,
    emissive: 0x3a1200,
    accent: '#ff8844',
    ringColor: 0xff4400,
    hasRings: false,
    glowColor: '#ff6600',
  },
  {
    id: 'projects',
    label: 'PROJECTS',
    position: new THREE.Vector3(0, -60, -320),
    radius: 42,
    color: 0x44ff88,
    emissive: 0x003311,
    accent: '#44ff88',
    ringColor: 0x00cc44,
    hasRings: true,
    glowColor: '#44ff88',
  },
  {
    id: 'education',
    label: 'EDUCATION',
    position: new THREE.Vector3(-180, 80, -400),
    radius: 36,
    color: 0xcc44ff,
    emissive: 0x220033,
    accent: '#cc44ff',
    ringColor: 0x9900cc,
    hasRings: false,
    glowColor: '#cc44ff',
  },
  {
    id: 'contact',
    label: 'CONTACT & CERTS',
    position: new THREE.Vector3(220, 100, -500),
    radius: 0, // blackhole — special
    isBlackhole: true,
    accent: '#ff2266',
    glowColor: '#ff2266',

];

/* ══════════════════════════════════════════════════
   BUILD PLANET MESHES
══════════════════════════════════════════════════ */
const planetMeshes = [];

function buildPlanetTexture(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 512;
  const ctx = c.getContext('2d');
  const base = new THREE.Color(color);
  const hex = `#${base.getHexString()}`;
  ctx.fillStyle = hex;
  ctx.fillRect(0,0,512,512);
  // continent blobs
  for (let i = 0; i < 18; i++) {
    const x = Math.random()*512, y = Math.random()*512;
    const r = 20 + Math.random()*80;
    const grad = ctx.createRadialGradient(x,y,0,x,y,r);
    const light = new THREE.Color(color).offsetHSL(0, -0.1, 0.1 + Math.random()*0.15);
    grad.addColorStop(0, `rgba(${~~(light.r*255)},${~~(light.g*255)},${~~(light.b*255)},0.45)`);
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,512,512);
  }
  return new THREE.CanvasTexture(c);
}

function buildAtmosphereTexture(color) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(128,128,80,128,128,128);
  const col = new THREE.Color(color);
  grad.addColorStop(0, `rgba(${~~(col.r*255)},${~~(col.g*255)},${~~(col.b*255)},0)`);
  grad.addColorStop(0.7, `rgba(${~~(col.r*255)},${~~(col.g*255)},${~~(col.b*255)},0.08)`);
  grad.addColorStop(1, `rgba(${~~(col.r*255)},${~~(col.g*255)},${~~(col.b*255)},0.35)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}

function buildRingTexture(color) {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  const ctx = c.getContext('2d');
  const col = new THREE.Color(color);
  for (let x = 0; x < 512; x++) {
    const t = x / 512;
    const alpha = Math.sin(t * Math.PI) * (0.3 + Math.random() * 0.4);
    ctx.fillStyle = `rgba(${~~(col.r*255)},${~~(col.g*255)},${~~(col.b*255)},${alpha.toFixed(2)})`;
    ctx.fillRect(x,0,1,64);
  }
  return new THREE.CanvasTexture(c);
}

PLANETS.forEach(def => {
  const group = new THREE.Group();
  group.position.copy(def.position);

  if (def.isBlackhole) {
    // Blackhole: dark sphere + accretion disk + distortion sphere
    const coreGeo = new THREE.SphereGeometry(28, 32, 32);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
    const core = new THREE.Mesh(coreGeo, coreMat);
    group.add(core);

    // Accretion disk
    const diskGeo = new THREE.RingGeometry(32, 80, 64);
    const diskCanvas = document.createElement('canvas');
    diskCanvas.width = 512; diskCanvas.height = 64;
    const dctx = diskCanvas.getContext('2d');
    const dg = dctx.createLinearGradient(0,0,512,0);
    dg.addColorStop(0,   'rgba(255,20,80,0)');
    dg.addColorStop(0.2, 'rgba(255,80,20,0.9)');
    dg.addColorStop(0.5, 'rgba(255,200,50,1)');
    dg.addColorStop(0.8, 'rgba(255,80,20,0.9)');
    dg.addColorStop(1,   'rgba(255,20,80,0)');
    dctx.fillStyle = dg; dctx.fillRect(0,0,512,64);
    const diskTex = new THREE.CanvasTexture(diskCanvas);
    const diskMat = new THREE.MeshBasicMaterial({
      map: diskTex, side: THREE.DoubleSide, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false });
    const disk = new THREE.Mesh(diskGeo, diskMat);
    disk.rotation.x = Math.PI / 2.3;
    group.add(disk);

    // Glow halo
    const haloGeo = new THREE.SphereGeometry(34, 32, 32);
    const haloMat = new THREE.MeshBasicMaterial({
      color: 0xff2266, transparent: true, opacity: 0.08, side: THREE.BackSide });
    group.add(new THREE.Mesh(haloGeo, haloMat));

    def.mesh = group;
    def.radius = 28;
    scene.add(group);
    planetMeshes.push({ def, group, disk });
    return;
  }

  // Regular planet
  const geo  = new THREE.SphereGeometry(def.radius, 48, 48);
  const mat  = new THREE.MeshStandardMaterial({
    map: buildPlanetTexture(def.color),
    roughness: 0.8, metalness: 0.1,
    emissive: new THREE.Color(def.emissive), emissiveIntensity: 0.4,
  });
  const mesh = new THREE.Mesh(geo, mat);
  group.add(mesh);

  // Atmosphere
  const atmoGeo = new THREE.SphereGeometry(def.radius * 1.08, 32, 32);
  const atmoMat = new THREE.MeshBasicMaterial({
    map: buildAtmosphereTexture(def.color),
    transparent: true, side: THREE.FrontSide, depthWrite: false,
    blending: THREE.AdditiveBlending });
  group.add(new THREE.Mesh(atmoGeo, atmoMat));

  // Point light for color bounce
  const pLight = new THREE.PointLight(def.color, 1.5, def.radius * 5);
  group.add(pLight);

  // Rings
  if (def.hasRings) {
    const inner = def.radius * 1.3;
    const outer = def.radius * 2.1;
    const ringGeo = new THREE.RingGeometry(inner, outer, 128);
    const ringMat = new THREE.MeshBasicMaterial({
      map: buildRingTexture(def.ringColor), side: THREE.DoubleSide,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2 + (Math.random() - 0.5) * 0.3;
    ring.rotation.y = Math.random() * 0.5;
    group.add(ring);
  }

  def.mesh = group;
  scene.add(group);
  planetMeshes.push({ def, group, mesh });
});

function buildSpaceship() {
  const ship = new THREE.Group();

  // Body
  const bodyGeo = new THREE.ConeGeometry(1.2, 5, 8);
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0xaabbcc, metalness: 0.8, roughness: 0.2 });
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.rotation.x = Math.PI / 2;
  ship.add(body);

  // Wings
  const wingShape = new THREE.Shape();
  wingShape.moveTo(0,0); wingShape.lineTo(-3,-1); wingShape.lineTo(-2.5,1); wingShape.lineTo(0,0);
  const wingGeo = new THREE.ShapeGeometry(wingShape);
  const wingMat = new THREE.MeshStandardMaterial({ color: 0x8899aa, metalness: 0.7, roughness: 0.3, side: THREE.DoubleSide });
  const wingL = new THREE.Mesh(wingGeo, wingMat);
  wingL.position.set(0,0,-0.5); wingL.rotation.y = 0;
  ship.add(wingL);
  const wingR = wingL.clone();
  wingR.scale.x = -1; ship.add(wingR);

  // Engine glow
  const glowGeo = new THREE.SphereGeometry(0.6, 12, 12);
  const glowMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, transparent: true, opacity: 0.9 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.set(0, 0, 2.8); ship.add(glow);

  const eLight = new THREE.PointLight(0x00aaff, 2, 12);
  eLight.position.copy(glow.position); ship.add(eLight);

  ship.engineGlow = glow;
  ship.engineLight = eLight;
  return ship;
}

const proximityLabel = document.getElementById('proximity-label');
let nearPlanet = null;

function checkProximity() {
  let closest = null, closestDist = Infinity;
  PLANETS.forEach(def => {
    const d = camera.position.distanceTo(def.position);
    const threshold = def.radius + 90;
    if (d < threshold && d < closestDist) { closestDist = d; closest = def; }
  });
  nearPlanet = closest;
  if (closest) {
    proximityLabel.innerHTML = `Approaching <strong style="color:${closest.accent}">${closest.label}</strong> — Press <kbd style="background:rgba(0,255,255,0.2);padding:1px 6px;border-radius:3px;border:1px solid cyan">E</kbd> to Land`;
    proximityLabel.classList.add('show');
  } else {
    proximityLabel.classList.remove('show');
  }
}

  panel.style.setProperty('--accent', data.accent);

/* ══════════════════════════════════════════════════
   WARP / LIGHT-SPEED ANIMATION
══════════════════════════════════════════════════ */
const warpCanvas  = document.getElementById('warp-overlay');
const warpCtx     = warpCanvas.getContext('2d');
const warpDest    = document.getElementById('warp-destination');
const warpName    = document.getElementById('warp-dest-name');
const warpCountEl = document.getElementById('warp-countdown');

warpCanvas.width  = innerWidth;
warpCanvas.height = innerHeight;
window.addEventListener('resize', () => {
  warpCanvas.width  = innerWidth;
  warpCanvas.height = innerHeight;
});

// Generate warp star streaks
const NUM_WARP_STARS = 320;
const warpStars = Array.from({ length: NUM_WARP_STARS }, () => ({
  angle: Math.random() * Math.PI * 2,
  dist:  20 + Math.random() * 80,
  len:   0,
  speed: 1 + Math.random() * 3,
  width: 0.4 + Math.random() * 1.2,
}));

let warpActive = false;
let warpProgress = 0; // 0 → 1
let warpAlpha    = 0;
let warpRafId    = null;
let warpAccent   = '#00ccff';
let warpLanding  = null;
const WARP_DURATION = 2200; // ms total

function resetWarpStars() {
  warpStars.forEach(s => {
    s.angle = Math.random() * Math.PI * 2;
    s.dist  = 10 + Math.random() * 60;
    s.len   = 0;
  });
}

function drawWarpFrame(progress) {
  const W = warpCanvas.width, H = warpCanvas.height;
  const cx = W / 2, cy = H / 2;

  // Motion-blur trail
  warpCtx.fillStyle = `rgba(0,0,3,${0.25 + progress * 0.3})`;
  warpCtx.fillRect(0,0,W,H);

  const ease = progress < 0.5
    ? 4 * progress * progress * progress
    : 1 - Math.pow(-2 * progress + 2, 3) / 2;

  const col     = new THREE.Color(warpAccent);
  const r = ~~(col.r*255), g = ~~(col.g*255), b = ~~(col.b*255);

  warpStars.forEach(s => {
    const spd = s.speed * (1 + ease * 18);
    s.dist += spd;
    s.len   = spd * (2 + ease * 25);

    const x1 = cx + Math.cos(s.angle) * s.dist;
    const y1 = cy + Math.sin(s.angle) * s.dist;
    const x2 = cx + Math.cos(s.angle) * (s.dist + s.len);
    const y2 = cy + Math.sin(s.angle) * (s.dist + s.len);

    const alpha = Math.min(1, 0.3 + ease * 0.7);
    const grad  = warpCtx.createLinearGradient(x1,y1,x2,y2);
    grad.addColorStop(0, `rgba(${r},${g},${b},0)`);
    grad.addColorStop(1, `rgba(255,255,255,${alpha})`);

    warpCtx.beginPath();
    warpCtx.moveTo(x1,y1);
    warpCtx.lineTo(x2,y2);
    warpCtx.strokeStyle = grad;
    warpCtx.lineWidth  = s.width + ease * 2.5;
    warpCtx.stroke();

    // Wrap stars back from centre
    const maxDist = Math.hypot(cx,cy) * 1.2;
    if (s.dist > maxDist) {
      s.dist  = 10 + Math.random() * 40;
      s.angle = Math.random() * Math.PI * 2;
      s.len   = 0;
    }
  });

  // Central glow vortex
  const glowR = 40 + ease * 180;
  const glow  = warpCtx.createRadialGradient(cx,cy,0,cx,cy,glowR);
  glow.addColorStop(0,   `rgba(255,255,255,${0.05 + ease * 0.55})`);
  glow.addColorStop(0.3, `rgba(${r},${g},${b},${0.04 + ease * 0.25})`);
  glow.addColorStop(1,   'rgba(0,0,0,0)');
  warpCtx.fillStyle = glow;
  warpCtx.beginPath();
  warpCtx.arc(cx,cy,glowR,0,Math.PI*2);
  warpCtx.fill();

  // Final white flash at peak
  if (progress > 0.85) {
    const flashAlpha = (progress - 0.85) / 0.15;
    warpCtx.fillStyle = `rgba(255,255,255,${flashAlpha * 0.95})`;
    warpCtx.fillRect(0,0,W,H);
  }
}

function startWarp(def) {
  if (warpActive) return;
  warpActive   = true;
  warpProgress = 0;
  warpAccent   = def.accent;
  warpLanding  = def;

  // Show warp UI
  warpCanvas.classList.add('active');
  warpDest.style.setProperty('--warp-color', def.accent);
  warpName.textContent    = def.label;
  warpName.style.color    = def.accent;
  warpCountEl.textContent = 'ENGAGING HYPERDRIVE...';
  resetWarpStars();

  // Animate countdown text
  const phases = [
    { t: 0,    text: 'ENGAGING HYPERDRIVE...' },
    { t: 500,  text: 'WARP DRIVE ACTIVATED' },
    { t: 1000, text: 'APPROACHING TARGET...' },
    { t: 1600, text: 'BRACE FOR LANDING' },
  ];
  phases.forEach(({ t, text }) => {
    setTimeout(() => { if (warpActive) warpCountEl.textContent = text; }, t);
  });

  // Fade in destination label
  setTimeout(() => warpDest.classList.add('show'), 200);

  const startTime = performance.now();

  function warpLoop(now) {
    warpProgress = Math.min((now - startTime) / WARP_DURATION, 1);
    drawWarpFrame(warpProgress);

    if (warpProgress < 1) {
      warpRafId = requestAnimationFrame(warpLoop);
    } else {
      // Peak — white flash already at 1.0, now fade out & open panel
      setTimeout(() => {
        warpDest.classList.remove('show');
        // Fade out warp
        let fadeP = 1;
        function fadeOut() {
          fadeP -= 0.08;
          if (fadeP > 0) {
            warpCtx.fillStyle = `rgba(255,255,255,${fadeP})`;
            warpCtx.fillRect(0,0,warpCanvas.width,warpCanvas.height);
            requestAnimationFrame(fadeOut);
          } else {
            warpCanvas.classList.remove('active');
            warpCtx.clearRect(0,0,warpCanvas.width,warpCanvas.height);
            warpActive = false;
            openPanel(warpLanding.id);
          }
        }
        fadeOut();
      }, 120);
    }
  }
  warpRafId = requestAnimationFrame(warpLoop);
}

const labelDivs = [];
PLANETS.forEach(def => {
  const d = document.createElement('div');
  d.className = 'planet-label-div';
  d.textContent = def.label;
  d.style.color = def.accent;

});

const projVec = new THREE.Vector3();
function updateLabels() {
  labelDivs.forEach(({ def, el }) => {
    projVec.copy(def.position);
    projVec.y += def.radius + 14;
    projVec.project(camera);
    if (projVec.z > 1) { el.style.opacity = '0'; return; }
    const x = ( projVec.x  + 1) / 2 * innerWidth;
    const y = (-projVec.y  + 1) / 2 * innerHeight;
    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    const dist = camera.position.distanceTo(def.position);
    const alpha = Math.max(0, Math.min(1, 1 - (dist - 60) / 300));
    el.style.opacity = alpha.toFixed(2);
  });
}

══════════════════════════════════════════════════ */
const mmCanvas = document.getElementById('mm-canvas');
const mmCtx    = mmCanvas.getContext('2d');
function drawMinimap() {
  const W = 120, H = 120, cx = 60, cy = 60, scale = 0.08;
  mmCtx.clearRect(0,0,W,H);
  mmCtx.fillStyle = 'rgba(0,0,0,0.5)'; mmCtx.fillRect(0,0,W,H);
  // planets
  PLANETS.forEach(def => {
    const mx = cx + def.position.x * scale;
    const my = cy + def.position.z * scale;
    mmCtx.beginPath();
    mmCtx.arc(mx, my, 4, 0, Math.PI*2);
    mmCtx.fillStyle = def.accent;
    mmCtx.fill();
  });
  // player
  const px = cx + camera.position.x * scale;
  const py = cy + camera.position.z * scale;
  mmCtx.beginPath();
  mmCtx.arc(px, py, 3, 0, Math.PI*2);
  mmCtx.fillStyle = '#fff'; mmCtx.fill();
}

/* ══════════════════════════════════════════════════
   ANIMATION LOOP
══════════════════════════════════════════════════ */
const clock = new THREE.Clock();
const euler  = new THREE.Euler(0, 0, 0, 'YXZ');
const quat   = new THREE.Quaternion();
const moveDir = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = clock.getElapsedTime();

  if (!panelOpen && !introVisible && !warpActive) {
    // Camera rotation from yaw/pitch
    euler.set(pitch, yaw, 0);
    camera.quaternion.setFromEuler(euler);

    // Movement
    const boosting = keys['ShiftLeft'] || keys['ShiftRight'];
    const topSpeed = boosting ? BOOST_SPEED : MAX_SPEED;
    const accel = 4.0, decel = 3.0;

    moveDir.set(0, 0, 0);
    if (keys['KeyW']) moveDir.z -= 1;
    if (keys['KeyS']) moveDir.z += 1;
    if (keys['KeyA']) moveDir.x -= 1;
    if (keys['KeyD']) moveDir.x += 1;
    if (keys['Space']) moveDir.y += 1;
    if (keys['KeyC'])  moveDir.y -= 1;

    if (moveDir.lengthSq() > 0) {
      moveDir.normalize();
      speed = Math.min(speed + accel * dt, topSpeed);
    } else {
      speed = Math.max(speed - decel * dt, 0);
    }

    if (speed > 0) {
      const forward  = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
      const right    = new THREE.Vector3(1,0, 0).applyQuaternion(camera.quaternion);
      const up       = new THREE.Vector3(0,1, 0).applyQuaternion(camera.quaternion);
      const vel = new THREE.Vector3()
        .addScaledVector(forward, -moveDir.z)
        .addScaledVector(right,    moveDir.x)
        .addScaledVector(up,       moveDir.y)
        .normalize()
        .multiplyScalar(speed);
      camera.position.addScaledVector(vel, dt * 60);
    }

    // Ship follows camera
    shipPivot.position.copy(camera.position);
    shipPivot.quaternion.copy(camera.quaternion);

    // Tilt ship with keys
    const tiltZ = (keys['KeyA'] ? 0.3 : 0) - (keys['KeyD'] ? 0.3 : 0);
    shipModel.rotation.z += (tiltZ - shipModel.rotation.z) * 0.1;

    // Engine glow pulse
    const thrustAlpha = speed / BOOST_SPEED;
    shipModel.engineGlow.material.opacity = 0.4 + thrustAlpha * 0.6;
    shipModel.engineLight.intensity = 0.5 + thrustAlpha * 3;

    // Speed bar
    document.getElementById('speed-fill').style.height = (thrustAlpha * 100) + '%';

    checkProximity();
  }

  // Planet rotations
  planetMeshes.forEach(({ def, group, mesh, disk }) => {
    if (def.isBlackhole) {
      group.rotation.y += dt * 0.3;
      if (disk) disk.rotation.z += dt * 0.8;
    } else {
      group.rotation.y += dt * 0.08;
    }
  });

  // Planet hover bob
  PLANETS.forEach(def => {
    if (def.mesh) def.mesh.position.y = def.position.y + Math.sin(t * 0.4 + def.position.x * 0.01) * 3;
  });

  // Sun pulse
  sun.intensity = 2.5 + Math.sin(t * 0.5) * 0.5;

  updateLabels();
  drawMinimap();
  renderer.render(scene, camera);
}

animate();
